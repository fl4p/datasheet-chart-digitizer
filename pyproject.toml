[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datasheet-chart-digitizer"
version = "0.1.0"
description = "Find, digitize, calibrate, and validate curves from datasheet chart PDFs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opencv-python",
  "pillow",
  "pymupdf",
  "scipy",
]

[project.optional-dependencies]
synth = ["matplotlib>=3.8"]  # tools/synth_charts (synthetic chart generator)

[project.scripts]
dsdig = "datasheet_chart_digitizer.cli:main"
datasheet-chart-find = "datasheet_chart_digitizer.find_charts:main"
datasheet-chart-digitize-capacitance = "datasheet_chart_digitizer.mosfet_capacitance:main"
datasheet-chart-digitize-vpl = "datasheet_chart_digitizer.gate_charge_vpl:main"
datasheet-chart-export-coss-spice = "datasheet_chart_digitizer.coss_export:main"
datasheet-layout-cluster = "datasheet_chart_digitizer.layout_clustering:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "pytest",
  "pytest-xdist",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
# local default: 2 workers (a bare `pytest` must not saturate the Mac) and the fast subset;
# full suite on the remote host: scripts/test-remote.sh (-n 12 -m ""), locally `-m ""`.
# worksteal: an idle worker takes queued tests from a busy one (with `load`, tests queued behind a
# long one on one worker kept the others idle: 16 min cold where the CPU work fits in 6)
addopts = "-n 2 --dist worksteal -m 'not slow'"
